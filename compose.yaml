services:
  motion-studio:
    build:
      context: .
      dockerfile: Dockerfile
    image: motion-studio:local
    container_name: motion-studio
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MOTION_STUDIO_PORT:-4102}:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      REMOTION_BROWSER_EXECUTABLE: /usr/bin/chromium
      REMOTION_GL: swangle
      # Operator emails (comma separated). Empty in production = no operator.
      REQUIREMENTS_ADMIN_EMAILS: ${REQUIREMENTS_ADMIN_EMAILS:-}
      # Production signup stays closed; create operators with `npm run account:create`.
      SIGNUP_ENABLED: ${SIGNUP_ENABLED:-false}
    volumes:
      - ./.local-data:/app/.local-data
      - ./out:/app/out
      - ./input:/app/input:ro
      - ./backups:/app/backups
    init: true

  # HTTPS (2단계, 도메인 확정 후): Caddy reverse proxy 예시. 도메인을 넣고 주석을 푼다.
