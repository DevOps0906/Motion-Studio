<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1080" viewBox="0 0 1400 1080" role="img" aria-labelledby="title desc"><title id="title">Motion Studio 통합 플랫폼 구조도</title><desc id="desc">공유 에셋과 모션 엔진을 중심으로 GSAP 웹, R3F 갤러리, Remotion 영상을 연결하며 렌더 워커와 저장소를 공유한다.</desc><defs><linearGradient id="head"><stop stop-color="#312847"/><stop offset="1" stop-color="#162b43"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#9c8ec2"/></marker><style>text{font-family:Arial,'Malgun Gothic',sans-serif}.label{fill:#b6c2d6;font-size:15px}.title{fill:#f1f5f9;font-size:23px;font-weight:700}.small{fill:#b6c2d6;font-size:14px}.tag{fill:#c4b5fd;font-size:12px;letter-spacing:2px}.line{fill:none;stroke:#9c8ec2;stroke-width:2;marker-end:url(#arrow)}.box{fill:#151e30;stroke:#40506b;stroke-width:1.5}.future{fill:#11192b;stroke:#68748b;stroke-width:1.5;stroke-dasharray:7 5}</style></defs>
<rect width="1400" height="1080" rx="20" fill="#0b1020"/><text x="60" y="55" class="tag">MOTION STUDIO / SYSTEM ARCHITECTURE · v0.2</text><text x="60" y="100" fill="#f1f5f9" font-size="34" font-weight="700">하나의 기반, 세 가지 제작 경험</text><text x="60" y="132" class="label">Next.js · TypeScript · 공유 미디어 · 프로젝트 JSON · 프레임 기반 검증</text>
<rect x="60" y="165" width="1280" height="95" rx="14" fill="url(#head)" stroke="#6f628d"/><text x="90" y="202" class="title">통합 워크스페이스</text><text x="90" y="236" class="label">대시보드 / 프로젝트 / 이미지·영상·음악 등록 / 템플릿 / 렌더 결과</text><path d="M700 260V295" class="line"/>
<rect x="60" y="300" width="620" height="120" rx="14" class="box"/><text x="87" y="337" class="title">공유 에셋·프로젝트</text><text x="87" y="370" class="label">Asset ID · 원본 보존 · 분할 · 영상 프레임 캡처</text><text x="87" y="399" class="small">schemaVersion · templateId/version · 저장·복원</text>
<rect x="710" y="300" width="630" height="120" rx="14" class="box"/><text x="738" y="337" class="title">공유 모션·템플릿 엔진</text><text x="738" y="370" class="label">순수 sceneState(t) · 카메라 · 타일 · 브랜드·오디오</text><text x="738" y="399" class="small">실시간 시계와 프레임 시계 분리 · 결정적 상태</text>
<path d="M370 420V450H270H1130M270 450V485M700 450V485M1130 450V485" class="line"/><path d="M1025 420V450" fill="none" stroke="#9c8ec2" stroke-width="2"/>
<rect x="60" y="490" width="400" height="160" rx="14" class="box"/><text x="87" y="522" class="tag">01 / WEB &amp; LANDING</text><text x="87" y="560" class="title">GSAP 웹 모듈</text><text x="87" y="595" class="label">Timeline · ScrollTrigger · 반응형</text><text x="87" y="625" class="small">/showcase · 랜딩 프리뷰</text>
<rect x="500" y="490" width="400" height="160" rx="14" class="box"/><text x="527" y="522" class="tag">02 / SPATIAL GALLERY</text><text x="527" y="560" class="title">React Three Fiber</text><text x="527" y="595" class="label">회전 · 탐색 · 사진 확대 · 투어</text><text x="527" y="625" class="small">현재: 사진 갤러리 + GLB 건축 뷰어 / 계획: CAD 생성·검증</text>
<rect x="940" y="490" width="400" height="160" rx="14" class="box"/><text x="967" y="522" class="tag">03 / VIDEO AUTOMATION</text><text x="967" y="560" class="title">Remotion 영상 모듈</text><text x="967" y="595" class="label">사진·로고 → 15초 인트로</text><text x="967" y="625" class="small">1080p / 30fps / 450프레임 / H.264</text>
