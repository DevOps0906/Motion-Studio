<path d="M700 825V865" class="line" stroke-dasharray="7 5"/><rect x="60" y="870" width="1280" height="150" rx="14" class="future"/><text x="87" y="902" class="tag">ROADMAP / 후속 확장 · 현재 생성 기능 아님</text><text x="87" y="940" class="title">영상 자동화 + CAD 건축 → R3F·Unity·Unreal → SaaS</text><text x="87" y="975" class="label">영상 템플릿 / MCP 어댑터 / CAD 검증·변환 / 엔진별 출력 / 인증·테넌트·작업 큐</text><text x="87" y="1001" class="small">외부 AI 공급자와 비용은 별도 어댑터로 분리. 설정 없이 유료 호출하지 않습니다.</text><text x="60" y="1055" class="small">실선: 현재 연결된 기반 또는 프로토타입 · 점선: 확장 설계 · 모듈별 상품화 완성도는 별도 검증</text></svg>


