<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1360" viewBox="0 0 1400 1360" role="img" aria-labelledby="title desc"><title id="title">Motion Studio 전 생애 개발주기</title><desc id="desc">기획, 디자인, 공통 구조, 공통 구현, 웹·3D·영상 모듈, 통합 검증, 사용자 베타, 출시·운영, 모듈 확장, SaaS로 진행하고 피드백으로 기획에 돌아간다.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a99bd1"/></marker><style>text{font-family:Arial,'Malgun Gothic',sans-serif}.t{fill:#f1f5f9;font-size:22px;font-weight:700}.s{fill:#b6c2d6;font-size:15px}.k{fill:#c4b5fd;font-size:12px;letter-spacing:2px}.box{fill:#151e30;stroke:#4a5872;stroke-width:1.5}.now{fill:#25213a;stroke:#a797d2;stroke-width:2}.future{fill:#11192b;stroke:#71809b;stroke-width:1.5;stroke-dasharray:7 5}.line{fill:none;stroke:#a99bd1;stroke-width:2;marker-end:url(#a)}</style></defs><rect width="1400" height="1360" rx="20" fill="#0b1020"/><text x="60" y="55" class="k">MOTION STUDIO / DEVELOPMENT LIFECYCLE</text><text x="60" y="105" class="t" font-size="34">기획에서 출시, 그리고 다음 모듈까지</text><text x="60" y="138" class="s">웹사이트 제작기는 핵심 제품 목표 · 현재 GSAP 시연 / 3D 탐색 시제품 / 15초 인트로 MVP</text>
