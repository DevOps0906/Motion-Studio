<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1520" viewBox="0 0 1400 1520" role="img" aria-labelledby="title desc"><title id="title">Motion Studio AI 건축 개발주기 구조도</title><desc id="desc">건축 확장 기획. 실제 CAD·엔진 연결은 미검증. MCP·모델링·검증·변환·출력을 구분한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#94b8d9"/></marker><style>text{font-family:Arial,'Malgun Gothic',sans-serif}.title{fill:#f1f5f9;font-size:24px;font-weight:700}.body{fill:#b6c2d6;font-size:16px}.tag{fill:#93c5fd;font-size:12px;letter-spacing:2px}.plan{fill:#121f32;stroke:#6683a7;stroke-width:1.5;stroke-dasharray:7 5}.current{fill:#27223c;stroke:#b7a6e8;stroke-width:1.5}.line{fill:none;stroke:#94b8d9;stroke-width:2;marker-end:url(#arrow)}</style></defs><rect width="1400" height="1520" rx="20" fill="#0b1020"/><text x="60" y="55" class="tag">MOTION STUDIO / ARCHITECTURAL DEVELOPMENT TRACK · PLANNED</text><text x="60" y="105" class="title">건축 확장 트랙은 이렇게 진행합니다</text><text x="60" y="138" class="body">기존 웹·영상의 검증 주기를 유지하고, 공간 모듈에서 별도 분기합니다.</text><rect x="150" y="180" width="1100" height="115" rx="14" class="plan"/><text x="175" y="218" class="title">ARC-001 · 요구사항·환경 확인</text><text x="175" y="253" class="body">도면·치수·단위·방위·도구 버전·연결 조건 / 실제 건축 승인과 분리</text><path d="M700 295V320" class="line"/><rect x="150" y="330" width="1100" height="115" rx="14" class="plan"/><text x="175" y="368" class="title">G0 → G1 · MCP/CLI 작은 연결 시험</text><text x="175" y="403" class="body">읽기·기능 목록 → 별도 문서의 큐브 1개 → 치수 조회·저장·재열기·복구</text><path d="M700 445V470" class="line"/><rect x="150" y="480" width="1100" height="115" rx="14" class="plan"/><text x="175" y="518" class="title">G2 · 3층 데모 모델 생성·CAD 검수</text><text x="175" y="553" class="body">Rhino·Grasshopper / 필요 부품은 Fusion / 한 세션 한 작성자</text><path d="M700 595V620" class="line"/><rect x="150" y="630" width="1100" height="115" rx="14" class="plan"/><text x="175" y="668" class="title">G3 · 변환·최적화·검증</text><text x="175" y="703" class="body">직접 GLB 또는 Blender → 축·배율·층·ID·재질·성능 예산 검사</text><path d="M700 745V770" class="line"/><rect x="150" y="780" width="1100" height="115" rx="14" class="plan"/><text x="175" y="818" class="title">B1 · R3F 건축 뷰어 시제품</text><text x="175" y="853" class="body">구현: GLB 2.0 미리보기·저장 라이브러리 / 다음: 실제 CAD 메타 연결</text><path d="M700 895V920" class="line"/><rect x="150" y="930" width="1100" height="115" rx="14" class="plan"/><text x="175" y="968" class="title">G4 · 사용자·브라우저 검수</text><text x="175" y="1003" class="body">치수·시각 승인 / 모바일·성능·로딩·누락·복구 검사 → 실패 시 앞 단계 수정</text><path d="M700 1045V1080H370H1030M370 1080V1110M1030 1080V1110" class="line"/><rect x="60" y="1120" width="620" height="145" rx="14" class="plan"/><text x="85" y="1158" class="title">B2 · Unity 전시관 PoC</text><text x="85" y="1193" class="body">전시실 1개·작품 10개·이동·충돌·투어</text><text x="85" y="1221" class="body">Web 빌드·목표 기기 검증 후 범위 확대</text><rect x="720" y="1120" width="620" height="145" rx="14" class="plan"/><text x="745" y="1158" class="title">B3 · Unreal 모델하우스 PoC</text><text x="745" y="1193" class="body">공간 2개·재질 3종·실시간 체험</text><text x="745" y="1221" class="body">GPU 세션·연결·지연·종료·비용 측정</text><path d="M370 1265V1290H1030M700 1290V1315M1030 1265V1290" class="line"/><rect x="150" y="1325" width="1100" height="115" rx="14" class="plan"/><text x="175" y="1363" class="title">G5 · 반복 제작·운영 → 선택적 SaaS</text><text x="175" y="1398" class="body">버전·저장점·리포트·작업 큐·비용 계측 → 라이선스·무인 실행·테넌트 운영 검토</text><text x="60" y="1480" class="body">현재 상태: 기획·명세 단계. 이 다이어그램의 CAD·Unity·Unreal 단계는 구현 완료를 의미하지 않습니다.</text></svg>