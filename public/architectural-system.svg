<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1370" viewBox="0 0 1400 1370" role="img" aria-labelledby="title desc"><title id="title">Motion Studio AI 건축 시스템 확장 구조도</title><desc id="desc">건축 확장 기획. 실제 CAD·엔진 연결은 미검증. MCP·모델링·검증·변환·출력을 구분한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#94b8d9"/></marker><style>text{font-family:Arial,'Malgun Gothic',sans-serif}.title{fill:#f1f5f9;font-size:24px;font-weight:700}.body{fill:#b6c2d6;font-size:16px}.tag{fill:#93c5fd;font-size:12px;letter-spacing:2px}.plan{fill:#121f32;stroke:#6683a7;stroke-width:1.5;stroke-dasharray:7 5}.current{fill:#27223c;stroke:#b7a6e8;stroke-width:1.5}.line{fill:none;stroke:#94b8d9;stroke-width:2;marker-end:url(#arrow)}</style></defs><rect width="1400" height="1370" rx="20" fill="#0b1020"/><text x="60" y="55" class="tag">MOTION STUDIO / ARCHITECTURAL SYSTEM · PLANNED</text><text x="60" y="105" class="title">AI 건축 모델링에서 웹 체험까지</text><text x="60" y="138" class="body">도구 연결·CAD 원본·변환 패키지·엔진 출력의 책임을 분리합니다.</text><rect x="60" y="175" width="1280" height="105" rx="14" class="current"/><text x="85" y="213" class="title">Motion Studio 공통 기반</text><text x="85" y="248" class="body">현재: 대시보드·프로젝트·미디어·작업·GLB 모델 라이브러리 / CAD 어댑터는 확장 계획</text><path d="M700 280V310" class="line"/><rect x="60" y="320" width="1280" height="110" rx="14" class="plan"/><text x="85" y="358" class="title">입력·모델링 명세</text><text x="85" y="393" class="body">도면·이미지·치수·프롬프트 → 단위·방위·층·객체 ID·파라미터·검수 기준</text><path d="M700 430V460" class="line"/><rect x="60" y="470" width="1280" height="105" rx="14" class="plan"/><text x="85" y="508" class="title">AI 실행 · MCP/CLI 연결 계층</text><text x="85" y="543" class="body">기능 탐색 → 단일 작성자 세션 → 변경 전 저장 → 직렬 실행 → 결과·로그 조회</text><path d="M700 575V600H260H1140M260 600V625M700 600V625M1140 600V625" class="line"/><rect x="60" y="635" width="400" height="135" rx="14" class="plan"/><text x="85" y="673" class="title">Rhino · Grasshopper</text><text x="85" y="708" class="body">건축 매스·층·곡면·파사드</text><text x="85" y="736" class="body">파라미터·원본 .3dm/.gh</text><rect x="500" y="635" width="400" height="135" rx="14" class="plan"/><text x="525" y="673" class="title">Fusion</text><text x="525" y="708" class="body">정밀 부품·조립·하드웨어</text><text x="525" y="736" class="body">데스크톱 모델링 / 데이터 분리</text><rect x="940" y="635" width="400" height="135" rx="14" class="plan"/><text x="965" y="673" class="title">Blender</text><text x="965" y="708" class="body">조건부 메시·UV·PBR·LOD</text><text x="965" y="736" class="body">직접 GLB가 통과하면 생략 가능</text><path d="M260 770V795H1140M700 795V820M700 770V795M1140 770V795" class="line"/><rect x="60" y="830" width="1280" height="110" rx="14" class="plan"/><text x="85" y="868" class="title">CAD 검증 → 엔진별 변환·시각 검증</text><text x="85" y="903" class="body">원본 revision·단위/축·객체/층 ID → GLB·FBX·USD 등 → manifest·예산·검사 보고</text><path d="M700 940V965H260H1140M260 965V990M700 965V990M1140 965V990" class="line"/><rect x="60" y="1000" width="400" height="135" rx="14" class="current"/><text x="85" y="1038" class="title">B1 · R3F 뷰어 시제품</text><text x="85" y="1073" class="body">GLB 2.0 로컬 미리보기·저장 라이브러리</text><text x="85" y="1101" class="body">데모 층·파사드 조절 / CAD 메타 계획</text><rect x="500" y="1000" width="400" height="135" rx="14" class="plan"/><text x="525" y="1038" class="title">B2 · Unity Web 후속</text><text x="525" y="1073" class="body">Collider·이동·문·전시 선택</text><text x="525" y="1101" class="body">CLI/MCP → Web 빌드 검증</text><rect x="940" y="1000" width="400" height="135" rx="14" class="plan"/><text x="965" y="1038" class="title">B3 · Unreal 후속</text><text x="965" y="1073" class="body">MCP → 재질·조명·Sequencer</text><text x="965" y="1101" class="body">GPU 앱 → Pixel Streaming</text><path d="M260 1135V1160H1140M700 1160V1185M700 1135V1160M1140 1135V1160" class="line"/><rect x="60" y="1195" width="1280" height="100" rx="14" class="plan"/><text x="85" y="1233" class="title">최종 결과 · 사용자 검수</text><text x="85" y="1268" class="body">건축 웹 뷰어 / 가상 전시관 / 모델하우스 / 건축 영상 → 치수·시각·성능·운영 검수</text><text x="60" y="1335" class="body">실선 보라 상자: 기존 기반 · 파랑 점선 상자: 건축 확장 계획 · 도구 설치·연결·실제 모델 생성은 미실행</text></svg>